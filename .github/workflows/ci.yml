name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - claude/ai-recipe-auto-posting-xzbctl

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: テスト
        run: npm test
      - name: レシピ検証
        run: npm run validate
      - name: ビルド
        run: npm run build
