name: 画像生成

# レシピ用ブランチ(recipe/**)に push されると、画像が未生成のレシピの画像を gpt-image で作り、
# 同じブランチにコミットする。GITHUB_TOKEN の push は他のワークフローを起動しないため、
# 最後に CI を明示的に再実行する。

on:
  push:
    branches:
      - 'recipe/**'
  workflow_dispatch:
    inputs:
      limit:
        description: '1回に生成する最大枚数(最初の試験は 1)'
        default: '12'

permissions:
  contents: write
  actions: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 画像を生成
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # モデル名を変えるときは、リポジトリ変数 OPENAI_IMAGE_MODEL を設定する(未設定なら scripts/image-style.json の model)
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          LIMIT: ${{ inputs.limit || '12' }}
        run: npm run images -- --limit "$LIMIT"
      - name: 生成した画像をコミットして CI を再実行
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add public/images/recipes
          if git diff --cached --quiet; then
            echo "追加する画像はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AI生成画像を追加"
          git push origin "HEAD:${BRANCH}"
          gh workflow run ci.yml --ref "${BRANCH}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: 承認待ちで止まった重複のCIを削除
        if: steps.commit.outputs.pushed == 'true'
        # 上の push で作られる pull_request のCIは、承認待ち(action_required)のまま止まり、
        # PRのマージ時に「失敗」になって通知が出る。同じコミットは上で再実行したCIが検査するので、削除する。
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            ids=$(gh run list --branch "$BRANCH" --event pull_request --workflow ci.yml --limit 20 \
              --json databaseId,conclusion --jq '.[] | select(.conclusion == "action_required") | .databaseId')
            if [ -n "$ids" ]; then
              for id in $ids; do gh run delete "$id" && echo "削除しました: $id"; done
              exit 0
            fi
          done
          echo "承認待ちのCIは見つかりませんでした"
